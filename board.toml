schema_version = 2

[board]
example = false
name = "pipa"
kit = "pipa"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "Xiaomi Pad 6 (pipa, SM8250-AC) UniXNU bring-up"

# Android's userdata (sda34 on the UFS LUN 0), measured on the target 256 GB unit: first_lba 0x293000 and
# last_lba 0x3b037fa, i.e. 473448408 512-byte sectors / 242.4 GB. The start matches the 128 GB reference unit,
# so only the end grows. The windows are those of UniXNU-sheng: the same target image. "unixnu build userdata"
# writes the image for it; flashing it erases Android's data.
[userdata]
first_lba = 0x293000
last_lba = 0x3b037fa
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

[package]
unixnu = "../UniXNU"

[package.defconfig]
"ipados-17.7.11-21H461" = "pipa_defconfig"

[components]
# Native platform mainline components aligned with UniXNU component catalog. QcomGeniSpi and ShengNovatekTouch are the pipa
# touch transport and protocol; the Wi-Fi/Bluetooth components stay listed but their boot arguments are default-off below.
include = ["XnuPrelink", "DarwinBoot", "ArmDTPlatform", "ArmCpu", "SoftwareAES", "RamBlock", "VirtioMmioBlock", "VerifiedRoot", "ShengUfs", "GopFramebuffer", "AppleKeyStoreState", "ShengHidInput", "AdrenoPM4", "AdrenoFirmware", "ArmSmmu4K", "AirNir", "Ath12kWifi", "QcaBluetooth", "QcomGeniSpi", "ShengNovatekTouch"]

[ipsw]
url = "https://updates.cdn-apple.com/2025SpringFCS/fullrestores/122-77166/DCA6CFE8-90E9-4B92-880D-3DE171798E40/iPad_Pro_HFR_17.7.11_21H461_Restore.ipsw"
product = "iPad7,1"
version = "17.7.11"
build = "21H461"
device_class = "j120ap"
chip_id = 0x8011
board_id = 12
fetch = ["KernelCache", "DeviceTree", "StaticTrustCache", "Cryptex1,SystemTrustCache"]

[ipsw.sha256]
"044-76040-038.dmg" = "3f99b859c9728379110b66657c7b15285bcb1925ad8b5726542e2cdcf8b1028d"
"044-76034-038.dmg" = "b4908cde41d23e6bc05e6af51a2c9eeb00cf0f863a6a18b1600c96a3fd70414f"

[kernel]
defconfig = "pipa_defconfig"
config_fragments = [
  "arch:configs/common.config",
  "soc:configs/sm8250.config",
  "os:configs/ipados.config",
]
patch_series = [
  "arch:patches/xnu/series",
  "soc:patches/xnu/series",
  "os:patches/xnu/series",
  "device:patches/xnu/series",
]
archives = [
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "component:RamBlock",
  # The verified variant of the read-only block transport (CONFIG_XNU_NATIVE_VIRTIO_BLOCK_ARCHIVE) and the owner key it
  # authenticates against; no virtio device exists on pipa, so the transport itself never configures.
  "build-arm-driver.py VirtioMmioBlock --verified-root",
  "build-verified-root-key.py --pin 70a5ea346d2d779a7ef43eb4ed8b17f54488e160d8c2a6d6420969664e3ae798",
  "component:ShengUfs",
  "component:AppleKeyStoreState",
  "component:ShengHidInput",
  "build-libpthread-kernel.py",
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "build-link-stubs.py",
  "build-platform-power.py",
  "build-boot-progress.py",
  "build-adreno650.py",
  "build-pipa-gpu-addon.py",
  "build-gop-legacy-display.py",
  "check-pipa.py",
]

[kernel.prelink]
