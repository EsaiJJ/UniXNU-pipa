[device_tree]
source = "device:dts/pipa.dts"
include_dirs = ["soc:dts"]

# The firmware is the Mu-Silicium pipa branch (pipaPkg, Kona SM8250), with UniXNU, the ramdisk block device driver and
# DarwinBoot added. It keeps the upstream vendor driver set, which upstream lists as working for display, internal storage
# and the side buttons. Resources/DTBs/pipa.dtb already carries /reserved-memory/cont_splash_region@9c000000.
[firmware]
config = "pipa"
dsc = "Platforms/Xiaomi/pipaPkg/pipa.dsc"
fd = "Build/pipaPkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-pipa.py"]
submodules = ["Binaries", "Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/Gic-Spurious.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Xiaomi",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Platforms/Xiaomi",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
]

[firmware.defines]
ENABLE_SECUREBOOT = "1"
MEMORY_PROTECTION = "TRUE"
SHIP_MODE = "FALSE"
BUILDID_STRING = "pipa-research"
DEVICE_MODEL = "pipa"

[adt.defaults.u32]
vmm-present = 1
sleep-disabled = 1
# The kernel is built with CONFIG_VNODES=1024 (xsmall), so desiredvnodes clips to 1024; the desktop keeps about 1950 vnodes live and
# vnode jetsam then kills daemons several times a second. XNU reads this value before it clips.
"kern.maxvnodes" = 78848

[adt.chosen.u32]
kernel-ctrr-to-be-enabled = 0
display-rotation = 0
display-scale = 2

[adt.product.string]
model = "J120AP"
artwork-display-gamut = "sRGB"

[adt.product.u32]
thin-bezel = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2

# The ramdisk of the boot image: a FAT volume with the UniXNU config, the kernel, its device tree and the optional trust cache
# and Data seed. DarwinBoot is part of the firmware volume.
#
# Measured on the target 8 GB unit from /proc/device-tree/memory (two ranges, 0x80000000+0x3bb00000 and
# 0xc0000000+0x1c0000000, ending at 0x280000000). XNU takes dram-base and dram-size as one range (is_dram_addr, which only
# picks the attribute of device mappings), so the span includes the bootloader's 0xbbb00000..0xc0000000 hole; every register
# block lies below 0x80000000. The 16 GB reference unit also had a bank at 32 GiB, which this unit does not carry.
[payload]
volume = "PIPAESP"
size_mib = 192
loader = "firmware"
title = "Xiaomi Pad 6 (iPadOS 17.7.11)"
dram_size = "0x200000000"
timeout = 3
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "sheng-smp=1",
  "armcpu-self-ipi=1",
  "armcpu-spi-ipi=1",
  "armcpu-diagnostics=1",
  "dk=0",
  "kt_fixed_zones=120",
  "sheng-pmgr=2",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "native-ufs-root=1",
  "native-ufs-diagnostics=1",
  "sheng-data-persist=2",
  "sheng-disable-watchdogd=1",
  "-no_corpses",
  "sheng-disable-jobs=com.apple.identityservicesd,com.apple.locationd,com.apple.CommCenter,com.apple.bluetoothd,com.apple.PerfPowerServices,com.apple.iomfb_fdr_loader",
  "offline-mobile-graphics-load=1",
  "offline-legacy-register=1",
  "offline-legacy-phase=4",
  "offline-legacy-gop=1",
  "offline-legacy-unit-scale=2",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-cpu-present=1",
  "offline-key-events=1",
  "sheng-aks=1",
  "offline-hid-input=1",
  "offline-hid-home=1",
  "sheng-touch-hid=1",
  "sheng-vsync=60",
  "sheng-vsync-fixed=1",
  "pipa-restart-after=240",
  "pipa-panic-restart-after=10",
  "pipa-restart-crashes=3",
  "pipa-touch=5",
  "pipa-buttons=1",
  "pipa-cpufreq=1",
  "pipa-gpu=12",
  "sheng-gpu-addon=1",
  "sheng-fb-gpu=1",
  "pipa-wd=0",
]
tools = true
panic_screen = true
trust_cache_sha256 = [
  "7416ca4f8377146626bb284e2133c76bee6cb4e3ee0af5d648b186235a7323a7",
  "8900d6a93d7a59ce1a872a5c081e559f4240a218f97e12d44d22dda46644d68f",
  "b0ecabed316498522a36c395f65f10fdd9ede3a5ac91b8929bc532533c46faa0",
]
text_fixups = [
  "dyld_shared_cache_arm64.15,421e8bc,28ad1bb0008544f9,c0035fd6008544f9",
  "dyld_shared_cache_arm64.13,1b05bec,44008052,24008052",
  "dyld_shared_cache_arm64.13,1b05b08,44008052,24008052",
  "BTAudioHALPlugin,38bec,ffc300d1f44f01a9,000080d2c0035fd6",
  "dyld_shared_cache_arm64.11,34f3b84,979701944914d794,e0031faa1f2003d5",
]
[payload.install]
title = "Install and boot"
confirm = "ERASE all iPadOS user data and install again?"
confirm_titles = ["Erase Data, skip Hello, boot", "Erase Data, show Hello, boot"]
confirm_args = ["sheng-data-reset=1", "sheng-data-reset=2"]

[payload.adt]
chip_id = "8011"
unique_chip_id = "required"
# The DarwinBoot window is a contiguous request, not a hardware value. 0x170000000 (5.75 GiB) is the 16 GB reference
# port's window (12 of the 34 bootstrap-table pages the XNU patch reserves); it fits inside this 8 GB unit's
# 0xc0000000..0x280000000 bank on paper, but the first UEFI boot must confirm the allocation succeeds. Do not tune it
# from host checks alone.
owned_memory_size = "0x170000000"
dram_base = "0x80000000"
dram_size = "0x200000000"
psci_method = "smc"
ipad_identity = true
packed_data_ramdisk = true
persistent_data = true
root_match_volume_uuid = "04769D26-2CA0-4825-B443-E2E5F88300F2"

[bootimg]
dtb = "build/pipa/pipa.dtb"

[bootimg.image]
base = 0x10000000
kernel_offset = 0x8000
tags_offset = 0x100
pagesize = 2048
header_version = 1
