name: Pipa XNU source checks

on:
  workflow_dispatch:
  push:
    branches: [main, pipa]
  pull_request:

permissions:
  contents: read

concurrency:
  group: pipa-xnu-source-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  driver-and-source-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Pinned by commit: this job builds nothing secret, but a moving tag is still an unnecessary supply-chain input.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: '3.12'

      - name: Install device-tree compiler
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler

      - name: Validate board configuration, DTB compilation, and proprietary firmware manifest
        run: |
          set -euo pipefail
          dtc -I dts -O dtb -i socs/sm8250/dts dts/pipa.dts -o /tmp/pipa-hardware.dtb
          test -s /tmp/pipa-hardware.dtb
          python3 scripts/check-pipa.py
          python3 scripts/check-pipa-board.py

      - name: Compile and run Pipa board helper tests (GCC and Clang -Werror)
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror package/ButtonsTests.c -o /tmp/pipa-buttons-"$cc"
            /tmp/pipa-buttons-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/GpuPowerBoardTests.c -o /tmp/pipa-gpu-power-"$cc"
            /tmp/pipa-gpu-power-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/NativeBatteryTests.c -o /tmp/pipa-battery-"$cc"
            /tmp/pipa-battery-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I package package/TouchBoardTests.c -o /tmp/pipa-touch-board-"$cc"
            /tmp/pipa-touch-board-"$cc"
          done

      - name: Compile and run Pipa driver checks (GCC and Clang -Werror)
        run: |
          set -euo pipefail
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -I drivers/GopFramebuffer drivers/GopFramebuffer/Test/request-state.c -o /tmp/gop-test-"$cc"
            /tmp/gop-test-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -c package/QcomRpmh.c -o /tmp/qcom-rpmh-"$cc".o
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror \
              drivers/QcomGeniSpi/Test/geni-spi.c drivers/QcomGeniSpi/GeniSpi.c -o /tmp/geni-spi-"$cc"
            /tmp/geni-spi-"$cc"
          done
          # The upstream Novatek tests use compact one-line conditional blocks, so GCC's -Wmisleading-indentation is silenced
          # for them; the driver sources are compiled with the same warning set as the archive build otherwise.
          for cc in gcc clang; do
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation \
              drivers/ShengNovatekTouch/Test/nvt-protocol.c drivers/ShengNovatekTouch/NvtProtocol.c -o /tmp/nvt-protocol-"$cc"
            /tmp/nvt-protocol-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation \
              drivers/ShengNovatekTouch/Test/nvt-points.c drivers/ShengNovatekTouch/NvtProtocol.c -o /tmp/nvt-points-"$cc"
            /tmp/nvt-points-"$cc"
            "$cc" -std=c11 -O2 -Wall -Wextra -Werror -Wno-misleading-indentation \
              drivers/ShengNovatekTouch/Test/touch-core.c drivers/ShengNovatekTouch/NvtTouchCore.c -lm -o /tmp/touch-core-"$cc"
            /tmp/touch-core-"$cc"
          done
